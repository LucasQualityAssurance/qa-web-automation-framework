name: selenium-java-cucumber

on:
  push:
    branches: [main]
    paths:
      - 'selenium-java-cucumber/**'
      - '.github/workflows/selenium-java-cucumber.yml'
  pull_request:
    branches: [main]
    paths:
      - 'selenium-java-cucumber/**'
      - '.github/workflows/selenium-java-cucumber.yml'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Expressão de tags do Cucumber (ex.: @login and @negativo). Vazio roda todos os cenários.'
        required: false
        default: ''

# O workflow só precisa ler o código do repositório.
permissions:
  contents: read

# Uma nova execução no mesmo branch cancela a anterior que ainda estiver rodando.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cenarios:
    name: Cenários BDD (Chrome headless)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: selenium-java-cucumber

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Rodar os cenários
        env:
          TAGS: ${{ github.event.inputs.tags }}
        run: |
          if [ -n "$TAGS" ]; then
            echo "Rodando só os cenários com as tags: $TAGS"
            mvn -B clean test -Dheadless=true "-Dcucumber.filter.tags=$TAGS"
          else
            mvn -B clean test -Dheadless=true
          fi

      - name: Gerar o relatório Allure
        if: always()
        run: mvn -B allure:report

      - name: Publicar o relatório Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-cucumber
          path: selenium-java-cucumber/target/site/allure-maven-plugin
          retention-days: 14

      - name: Publicar o relatório HTML do Cucumber
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: selenium-java-cucumber/target/cucumber-reports/cucumber.html
          retention-days: 14
