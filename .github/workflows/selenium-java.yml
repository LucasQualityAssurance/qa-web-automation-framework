name: selenium-java

on:
  push:
    branches: [main]
    paths:
      - 'selenium-java/**'
      - '.github/workflows/selenium-java.yml'
  pull_request:
    branches: [main]
    paths:
      - 'selenium-java/**'
      - '.github/workflows/selenium-java.yml'
  workflow_dispatch:

jobs:
  testes:
    name: Testes Selenium (Chrome headless)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: selenium-java

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Rodar os testes
        run: mvn -B clean test -Dheadless=true

      - name: Gerar o relatório Allure
        if: always()
        run: mvn -B allure:report

      - name: Publicar o relatório Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: selenium-java/target/site/allure-maven-plugin
          retention-days: 14
